name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go vet & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # 会话相关的测试需要真实 MongoDB；没有 SCOPEX_TEST_MONGO 时这些测试自动跳过。
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          SCOPEX_TEST_MONGO: mongodb://127.0.0.1:27017
        run: go test ./...

      - name: go build
        run: go build -trimpath -o /tmp/scopex ./cmd/server

  frontend:
    name: TypeScript & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
